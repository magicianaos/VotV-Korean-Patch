name: 번역 검사

on:
  pull_request:
    paths:
      - "translation/locale_ja.json"
  push:
    branches: [main]
    paths:
      - "translation/locale_ja.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 이전 버전 가져오기
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          git show "$BASE:translation/locale_ja.json" > "$RUNNER_TEMP/base.json" 2>/dev/null || rm -f "$RUNNER_TEMP/base.json"

      - name: 검사
        run: python tools/check_translation.py translation/locale_ja.json "$RUNNER_TEMP/base.json"
